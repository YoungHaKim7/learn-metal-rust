[package]
name = "learn-metal-rust"
version = "0.1.0"
description = "10 runnable Rust examples for the metal-rust crate (Apple Metal)."

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace]
resolver = "3"
members = ["examples/*", "shared"]

[workspace.dependencies]
metal-cpp-rs = { git = "https://github.com/YoungHaKim7/metal-cpp-rs"}
shared = { path = "shared"}
